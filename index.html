
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VinLens Support</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #101113;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

nav {
    padding: 25px 8%;
    border-bottom: 1px solid #252629;
    font-size: 23px;
    font-weight: 800;
}

.logo span {
    color: #f5c400;
}

main {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
}

.support-card {
    max-width: 540px;
    width: 100%;
    text-align: center;
    background: #191a1d;
    border: 1px solid #292a2e;
    border-radius: 18px;
    padding: 50px 35px;
}

.icon {
    width: 65px;
    height: 65px;
    margin: 0 auto 25px;
    background: #302a13;
    color: #f5c400;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}

h1 {
    font-size: 34px;
    margin-bottom: 15px;
}

p {
    color: #a5a6aa;
    line-height: 1.7;
    font-size: 15px;
}

.email {
    display: block;
    margin-top: 30px;
    padding: 16px;
    border-radius: 10px;
    background: #f5c400;
    color: #111;
    font-weight: 800;
    text-decoration: none;
    transition: 0.2s;
}

.email:hover {
    background: #ffda35;
    transform: translateY(-2px);
}

.note {
    margin-top: 25px;
    font-size: 13px;
    color: #777;
}

footer {
    text-align: center;
    padding: 25px;
    border-top: 1px solid #252629;
    color: #777;
    font-size: 13px;
}

footer a {
    color: #aaa;
    text-decoration: none;
}
</style>
</head>
<body>

<nav>
    <div class="logo">VIN<span>LENS</span></div>
</nav>

<main>
    <div class="support-card">
        <div class="icon">✉</div>

        <h1>We're Here to Help.</h1>

        <p>
            Have a question, need assistance, or experiencing
            an issue with VinLens? Our support team is here to help.
            Reach out to us and we'll be happy to assist you.
        </p>

        <a class="email"
           href="mailto:duckhtml@gmail.com?subject=VinLens%20Support">
            Contact Support →
        </a>

        <div class="note">
            Support inquiries: duckhtml@gmail.com
        </div>
    </div>
</main>

<footer>
    © 2026 VinLens. All rights reserved.
</footer>

</body>
</html>
